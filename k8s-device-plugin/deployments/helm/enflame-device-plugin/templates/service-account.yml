{{- if or (include "enflame-device-plugin.hasConfigMap" .) ( and .Values.gfd.enabled .Values.nfd.enableNodeFeatureApi ) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "enflame-device-plugin.fullname" . }}-service-account
  namespace: {{ include "enflame-device-plugin.namespace" . }}
  labels:
    {{- include "enflame-device-plugin.labels" . | nindent 4 }}
{{- end }}

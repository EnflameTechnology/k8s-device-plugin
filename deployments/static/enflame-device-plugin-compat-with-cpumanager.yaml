apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: enflame-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: enflame-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      # This annotation is deprecated. Kept here for backward compatibility
      # See https://kubernetes.io/docs/tasks/administer-cluster/guaranteed-scheduling-critical-addon-pods/
      annotations:
        scheduler.alpha.kubernetes.io/critical-pod: ""
      labels:
        name: enflame-device-plugin-ds
    spec:
      serviceAccount: enflame-k8s-device-plugin
      tolerations:
      # This toleration is deprecated. Kept here for backward compatibility
      # See https://kubernetes.io/docs/tasks/administer-cluster/guaranteed-scheduling-critical-addon-pods/
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # Mark this pod as a critical add-on; when enabled, the critical add-on
      # scheduler reserves resources for critical add-on pods so that they can
      # be rescheduled after a failure.
      # See https://kubernetes.io/docs/tasks/administer-cluster/guaranteed-scheduling-critical-addon-pods/
      priorityClassName: "system-node-critical"
      containers:
      - image: artifact.enflame.cn/enflame_docker_images/enflame/k8s-device-plugin:v2.0.0
        name: enflame-device-plugin-ctr
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PASS_DEVICE_SPECS
          value: "true"
        - name: FAIL_ON_INIT_ERROR
          value: "false"
        - name: CUSTOM_REGISTER_RESOURCE
          value: "enflame.com/gcu,enflame-tech.com/gcu,enflame.com/vgcu"
        - name: CDI_CONFIG_PATH
          value: "/etc/cdi"
        - name: REGISTER_ALL_CDI_CONFIG
          value: "true"
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet
        - name: k8s-device-plugin-dir
          mountPath: /var/log/enflame/k8s-device-plugin
        - name: cdi-config
          mountPath: /etc/cdi
        - name: host-root
          mountPath: /host-root
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet
      - name: k8s-device-plugin-dir
        hostPath:
          path: /var/log/enflame/k8s-device-plugin
          type: DirectoryOrCreate
      - name: cdi-config
        hostPath:
          path: /etc/cdi
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: /

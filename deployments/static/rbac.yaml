kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: enflame-k8s-device-plugin
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - update
  - patch
  - get
  - list
  - watch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enflame-k8s-device-plugin
  namespace: kube-system
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: enflame-k8s-device-plugin
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enflame-k8s-device-plugin
subjects:
- kind: ServiceAccount
  name: enflame-k8s-device-plugin
  namespace: kube-system
